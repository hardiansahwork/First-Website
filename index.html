<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masjid Al-Kautsar — Display Jadwal</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  background: #0f1a30;
  color: #fff;
  position: relative;
}

/* ——— LATAR BELAKANG KANAN ——— */
.bg-right {
  position: absolute; top: 0; right: 0; width: 58%; height: 100%;
  background: url('https://images.unsplash.com/photo-1544745887-7ee1486ee4d8?w=1200') center/cover no-repeat;
  opacity: 0.85;
}

/* ——— PANEL JADWAL KIRI ——— */
.schedule-panel {
  position: absolute; top: 0; left: 0; width: 52%; height: 100%;
  z-index: 5;
}

/* Bentuk potong kanan atas Shubuh */
.shubuh-row {
  background: #422a0e;
  clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
  padding: 12px 28px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 900; font-size: 26px;
  color: #ffd700;
}
.shubuh-curve {
  position: absolute; top: 0; right: -50px; width: 100px; height: 80px;
  background: #0f1a30; border-radius: 0 0 0 100%;
  z-index: 10;
}

/* Baris Terbit — ujung lancip */
.terbit-row {
  background: #b71c1c;
  clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
  padding: 12px 28px; margin-top: 4px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 900; font-size: 26px;
}

/* Baris Jumat — ujung lancip */
.jumat-row {
  background: #007a2f;
  clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
  padding: 12px 28px; margin-top: 4px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 900; font-size: 26px;
}

/* Baris Ashar — ujung lancip */
.ashar-row {
  background: #008a38;
  clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
  padding: 12px 28px; margin-top: 4px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 900; font-size: 26px;
}

/* Baris Maghrib */
.maghrib-row {
  background: #424242;
  clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
  padding: 12px 28px; margin-top: 4px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 900; font-size: 26px;
}

/* Baris Isya */
.isya-row {
  background: #5e18b0;
  clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
  padding: 12px 28px; margin-top: 4px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 900; font-size: 26px;
}

.time-val { font-size: 38px; }

/* ——— JAM BULAT TENGAH ——— */
.clock-wrap {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 200px; height: 200px;
  background: radial-gradient(circle, #dd2222, #b00000);
  border-radius: 50%;
  border: 5px solid #fff;
  z-index: 15;
}
.clock-face { position: relative; width: 100%; height: 100%; }
.c-num {
  position: absolute; font-size: 20px; font-weight: 900; color: #fff;
}
.c12 { top: 12px; left: 50%; transform: translateX(-50%); }
.c3  { right: 12px; top: 50%; transform: translateY(-50%); }
.c6  { bottom: 12px; left: 50%; transform: translateX(-50%); }
.c9  { left: 12px; top: 50%; transform: translateY(-50%); }

.hand {
  position: absolute; bottom: 50%; left: 50%;
  transform-origin: bottom center;
  border-radius: 3px;
}
.h-hand { width: 7px; height: 55px; margin-left: -3.5px; background: #fff; }
.m-hand { width: 5px; height: 80px; margin-left: -2.5px; background: #fff; }
.s-hand { width: 2px; height: 85px; margin-left: -1px; background: #ffd700; }
.c-center {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 12px; height: 12px; background: #ffd700; border-radius: 50%; z-index: 10;
}

/* ——— KANAN ATAS: NAMA MASJID ——— */
.top-right {
  position: absolute; top: 16px; right: 24px; text-align: right; z-index: 8;
}
.mosque-name {
  font-size: 32px; font-weight: 900; color: #ffd700;
}
.mosque-address {
  font-size: 13px; color: #ddd; margin-top: 4px;
}
.date-bar {
  background: rgba(0,0,0,0.6);
  display: inline-block;
  padding: 6px 16px; margin-top: 10px;
  border-radius: 4px;
  font-size: 16px;
}

/* ——— BARIS BAWAH ——— */
.bottom-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.8);
  padding: 10px 24px;
  border-top: 3px solid #ffd700;
  font-size: 18px; font-weight: 700;
  z-index: 10;
}
</style>
</head>
<body>

<div class="schedule-panel">
  <div class="shubuh-curve"></div>
  
  <div class="shubuh-row">
    <span>Shubuh</span>
    <span class="time-val">04:23</span>
  </div>

  <div class="terbit-row">
    <span>Terbit</span>
    <span class="time-val">05:38</span>
  </div>

  <div class="jumat-row">
    <span>Jumat</span>
    <span class="time-val">11:56</span>
  </div>

  <div class="ashar-row">
    <span>Ashar</span>
    <span class="time-val">15:10</span>
  </div>

  <div class="maghrib-row">
    <span>Maghrib</span>
    <span class="time-val">18:07</span>
  </div>

  <div class="isya-row">
    <span>Isya</span>
    <span class="time-val">19:19</span>
  </div>
</div>

<!-- Jam Tengah -->
<div class="clock-wrap">
  <div class="clock-face">
    <div class="c-num c12">12</div>
    <div class="c-num c3">3</div>
    <div class="c-num c6">6</div>
    <div class="c-num c9">9</div>
    <div class="hand h-hand" id="hHand"></div>
    <div class="hand m-hand" id="mHand"></div>
    <div class="hand s-hand" id="sHand"></div>
    <div class="c-center"></div>
  </div>
</div>

<!-- Latar Kanan -->
<div class="bg-right"></div>

<!-- Info Kanan Atas -->
<div class="top-right">
  <div class="mosque-name">Masjid Al-Kautsar</div>
  <div class="mosque-address">
    Komplek Puri Mega Citra, Ciheulang, Ciparay, Kab. Bandung
  </div>
  <div class="date-bar">
    Jumat / 10 Februari 2023 M — 19 Rajab 1444 H
  </div>
</div>

<!-- Baris Bawah -->
<div class="bottom-bar">
  &nbsp;h atas infak dan dukungan Anda • ***
</div>

<script>
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  const secDeg = s * 6;
  const minDeg = m * 6 + s * 0.1;
  const houDeg = (h % 12) * 30 + m * 0.5;

  document.getElementById('sHand').style.transform = `rotate(${secDeg}deg)`;
  document.getElementById('mHand').style.transform = `rotate(${minDeg}deg)`;
  document.getElementById('hHand').style.transform = `rotate(${houDeg}deg)`;
}
setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
