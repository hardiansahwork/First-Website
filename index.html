<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid Al-Kautsar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        /* STEP 1: Mengatur Background Masjid Al-Jabbar Full Screen */
        body {
            background: url('https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=1920') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Memberikan sedikit lapisan gelap transparan agar nantinya teks lebih jelas dibaca */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }
    </style>
</head>
<body>

</body>
</html>
