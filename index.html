<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid Al-Kautsar</title>
    <!-- Google Fonts: Amiri & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        /* BACKGROUND MASJID AL-JABBAR MALAM HARI */
        body {
            background: url('Al-Jabbar.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        /* IDENTITAS MASJID & TANGGAL DI KANAN ATAS */
        .header-right {
            position: absolute;
            top: 25px;
            right: 35px;
            z-index: 10;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .mosque-title {
            font-family: 'Amiri', serif;
            font-size: 65px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            line-height: 1.1;
        }
        .mosque-title span {
            color: #facc15;
        }

        .mosque-address {
            font-size: 13px;
            color: #e2e8f0;
            margin-top: 4px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.3px;
        }

        .date-container {
            margin-top: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .date-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .date-text {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .date-divider {
            color: #64748b;
            font-weight: 400;
        }

        .hijri-text {
            font-family: 'Amiri', serif;
            font-size: 16px;
            color: #facc15;
        }

        /* PANEL JADWAL SHOLAT VERTIKAL PENUH DI KIRI */
        .prayer-sidebar {
            position: absolute;
            top: 25px;
            left: 30px;
            bottom: 25px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 290px;
        }

        .prayer-card {
            flex-grow: 1;
            padding: 12px 20px;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .prayer-name {
            font-size: 18px;
            font-weight: 700;
            color: #facc15;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .prayer-time {
            font-size: 40px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            line-height: 1.1;
            margin-top: 2px;
        }

        .bg-shubuh { background: rgba(20, 35, 30, 0.78); }
        .bg-syuruq { background: rgba(20, 85, 100, 0.78); }
        .bg-dzuhur { background: rgba(70, 45, 80, 0.78); }
        .bg-ashar  { background: rgba(180, 110, 20, 0.78); }
        .bg-maghrib{ background: rgba(160, 40, 40, 0.78); }
        .bg-isya   { background: rgba(80, 30, 120, 0.78); }
    </style>
</head>
<body>

    <!-- Panel Jadwal Sholat Vertikal Penuh -->
    <div class="prayer-sidebar">
        <div class="prayer-card bg-shubuh">
            <div class="prayer-name">Shubuh</div>
            <div id="time-shubuh" class="prayer-time">--:--</div>
        </div>
        <div class="prayer-card bg-syuruq">
            <div class="prayer-name">Syuruq</div>
            <div id="time-syuruq" class="prayer-time">--:--</div>
        </div>
        <div class="prayer-card bg-dzuhur">
            <div class="prayer-name">Dzuhur</div>
            <div id="time-dzuhur" class="prayer-time">--:--</div>
        </div>
        <div class="prayer-card bg-ashar">
            <div class="prayer-name">Ashar</div>
            <div id="time-ashar" class="prayer-time">--:--</div>
        </div>
        <div class="prayer-card bg-maghrib">
            <div class="prayer-name">Maghrib</div>
            <div id="time-maghrib" class="prayer-time">--:--</div>
        </div>
        <div class="prayer-card bg-isya">
            <div class="prayer-name">Isya</div>
            <div id="time-isya" class="prayer-time">--:--</div>
        </div>
    </div>

    <!-- Bagian Kanan Atas (Identitas & Tanggal) -->
    <div class="header-right">
        <div>
            <h1 class="mosque-title"><span>Masjid</span> Al-Kautsar</h1>
            <p class="mosque-address">Komplek Puri Mega Citra, Ciheulang, Ciparay, Kab. Bandung.</p>
        </div>

        <div class="date-container">
            <div class="date-dot"></div>
            <div id="masehi-date" class="date-text">Memuat Tanggal...</div>
            <div class="date-divider">|</div>
            <div id="hijri-date" class="hijri-text">Memuat Hijriyah...</div>
        </div>
    </div>

    <!-- Script Tanggal & API Jadwal Sholat Kemenag RI (Kab. Bandung) -->
    <script>
        function updateDate() {
            const now = new Date();
            const options = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById('masehi-date').innerText = now.toLocaleDateString('id-ID', options);
        }
        updateDate();

        async function fetchJadwalSholat() {
            const today = new Date().toISOString().split('T')[0];
            const idKabBandung = "1211"; // ID Kemenag Kabupaten Bandung
            const url = `https://api.myquran.com/v2/sholat/jadwal/${idKabBandung}/${today}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.status) {
                    const j = data.data.jadwal;
                    document.getElementById('time-shubuh').innerText = j.subuh;
                    document.getElementById('time-syuruq').innerText = j.terbit;
                    document.getElementById('time-dzuhur').innerText = j.dzuhur;
                    document.getElementById('time-ashar').innerText = j.ashar;
                    document.getElementById('time-maghrib').innerText = j.maghrib;
                    document.getElementById('time-isya').innerText = j.isya;

                    if (j.date) {
                        document.getElementById('hijri-date').innerText = j.date;
                    }
                }
            } catch (error) {
                console.error("Gagal mengambil jadwal sholat:", error);
            }
        }
        fetchJadwalSholat();
    </script>
</body>
</html>
